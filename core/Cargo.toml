[workspace]
resolver = "3"
members = ["dicto-core", "dicto-ffi"]

[workspace.package]
version = "0.1.9"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
dicto-core = { path = "dicto-core" }
async-trait = "0.1"
base64 = "0.22"
bzip2 = "0.6"
futures-util = "0.3"
hex = "0.4"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream", "http2"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = { version = "2.0.1", default-features = false }
tar = { version = "0.4", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
uniffi = "0.32"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
