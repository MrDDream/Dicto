[package]
name = "dicto-desktop"
version = "0.1.6"
description = "Dicto : dictée vocale pour Windows, Linux et macOS"
edition = "2024"
rust-version = "1.85"

# Projet à part du workspace du cœur (core/) : il en dépend par chemin.
[workspace]

[lib]
name = "dicto_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dicto-ffi = { path = "../../core/dicto-ffi" }
# Capture du micro (WASAPI, CoreAudio, ALSA/PulseAudio/PipeWire).
cpal = "0.18"
# Écriture dans la fenêtre active (SendInput, CGEvent, X11).
enigo = "0.6"
arboard = "3"
log = "0.4"
tauri-plugin-dialog = "2"
# Clés d'API dans le coffre du système (Gestionnaire d'identification, Trousseau, Secret Service).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Décodage des fichiers audio (MP3, M4A/AAC, WAV, FLAC, OGG Vorbis…).
symphonia = { version = "0.5", features = ["all"] }
# Mises à jour : la dernière version sur GitHub, son téléchargement et sa somme de contrôle.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["time", "sync", "macros"] }

# App au premier plan (profils par app) et boutons latéraux de la souris, propres à chaque système.
[target.'cfg(target_os = "linux")'.dependencies]
# X11 en Rust pur : fenêtre active (WM_CLASS) et boutons de souris (XInput 2, événements bruts).
x11rb = { version = "0.13", features = ["xinput"] }
# Wayland : raccourcis globaux par le portail XDG (GlobalShortcuts).
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
core-graphics = "0.25"
core-foundation = "0.10"

[features]
default = ["engines"]
# Moteurs locaux : whisper.cpp et sherpa-onnx (Parakeet, Canary, Nemotron…).
# Sans eux, l'app compile vite (vérifications) mais ne propose que les services en ligne.
engines = ["dicto-ffi/whisper", "dicto-ffi/sherpa-shared"]
vulkan = ["engines", "dicto-ffi/whisper-vulkan"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
